<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <style>
      /* Rows off screen skip layout, so changes show fast with hundreds of tasks (REQ-019). */
      #task-list > li {
        content-visibility: auto;
        contain-intrinsic-size: auto 2.5em;
      }
      /* The word carries the meaning; dark red on white (about 8:1) passes WCAG AA (REQ-026). */
      .task-overdue {
        color: #a40000;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
